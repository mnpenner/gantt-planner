<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAML to Gantt Chart with Monaco</title>
    <style>
        /* ... (Your existing CSS, no changes needed here for this fix) ... */
        body {
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f0f0;
            overflow: hidden;
        }

        header {
            background-color: #333;
            color: white;
            padding: 5px 20px;
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
        }

        .container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        .yaml-pane {
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }

        .gantt-pane {
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #fff;
            position: relative;
        }

        .gantt-chart-header {
            padding: 15px;
            padding-bottom: 0;
            flex-shrink: 0;
        }

        .gantt-pane h3 {
            margin: 0;
        }

        #gantt-chart-target-container {
            flex-grow: 1;
            overflow: auto;
            min-height: 0;
            padding: 0 15px 15px 15px;
        }

        #gantt-chart-target {
            height: 100%;
        }


        .resizer {
            width: 10px;
            background-color: #ccc;
            cursor: col-resize;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .resizer:hover {
            background-color: #bbb;
        }

        .resizer::before {
            content: '⋮';
            color: #555;
            font-size: 12px;
            line-height: 0;
        }


        .yaml-pane h3 {
            flex-shrink: 0;
            margin-top: 0;
            margin-bottom: 10px;
            color: #d4d4d4;
        }

        .yaml-pane .file-controls,
        .yaml-pane #error-display {
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        .yaml-pane #error-display {
            margin-top: 0;
        }


        #monaco-editor-container {
            flex-grow: 1;
            min-height: 0;
            border: 1px solid #333;
        }

        .file-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-controls button, .file-controls label {
            background-color: #007acc;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        .file-controls button:hover, .file-controls label:hover {
            background-color: #005a9e;
        }

        #load-file-input {
            display: none;
        }

        .error-message {
            color: #ff8a80;
            background-color: #2c0b08;
            border: 1px solid #ff8a80;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
        }

        .gantt .bar-label { font-size: 12px; font-weight: 500; fill: #333; }
        .gantt .bar-wrapper.active .bar { filter: brightness(130%); }
        .gantt .bar-flight .bar { fill: #8ECAE6; }
        .gantt .bar-flight .bar-label { fill: #023047; }
        .gantt .bar-hotel .bar { fill: #219EBC; }
        .gantt .bar-hotel .bar-label { fill: #fff; }
        .gantt .bar-activity .bar { fill: #FFB703; }
        .gantt .bar-activity-stay .bar { fill: #FB8500; }
        .gantt .bar-activity-stay .bar-label { fill: #fff; }
        .gantt .bar-buffer .bar { fill: #cccccc; stroke: #aeaeae; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
</head>
<body>
    <header>
        <h1>YAML to Gantt Chart Live Preview</h1>
    </header>
    <div class="container" id="main-container">
        <div class="yaml-pane" id="yaml-pane">
            <h3>YAML Configuration:</h3>
            <div class="file-controls">
                <button id="save-to-disk-button">Save YAML</button>
                <label for="load-file-input" id="load-from-disk-label">Load YAML</label>
                <input type="file" id="load-file-input" accept=".yaml,.yml">
            </div>
            <div id="error-display" class="error-message" style="display:none;"></div>
            <div id="monaco-editor-container"></div>
        </div>
        <div class="resizer" id="resizer"></div>
        <div class="gantt-pane" id="gantt-pane">
            <div class="gantt-chart-header">
                <h3>Gantt Chart Preview:</h3>
            </div>
            <div id="gantt-chart-target-container">
                <div id="gantt-chart-target"></div>
            </div>
        </div>
    </div>

    <!-- Load Day.js and its plugin BEFORE other scripts that might depend on it or Monaco loader -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/customParseFormat.js"></script>
    <script>
        // Ensure dayjs and its plugin are available globally before Monaco's loader runs.
        // The plugin script typically extends dayjs automatically if dayjs is already global.
        // If not, you might need to do:
        if (window.dayjs && window.dayjs_plugin_customParseFormat) {
            dayjs.extend(window.dayjs_plugin_customParseFormat);
        } else {
            console.error("Day.js or its CustomParseFormat plugin failed to load.");
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>

    <script>
        // --- Main Application Logic ---
        const yamlPane = document.getElementById('yaml-pane');
        const ganttPane = document.getElementById('gantt-pane');
        const resizer = document.getElementById('resizer');
        const ganttChartTargetContainer = document.getElementById('gantt-chart-target-container');
        const ganttChartTargetElement = document.getElementById('gantt-chart-target');
        const errorDisplay = document.getElementById('error-display');
        const monacoEditorContainer = document.getElementById('monaco-editor-container');
        const saveToDiskButton = document.getElementById('save-to-disk-button');
        const loadFileInput = document.getElementById('load-file-input');
        const mainContainer = document.getElementById('main-container');

        let monacoEditor;
        let gantt;
        let debounceTimer;
        const LOCAL_STORAGE_KEY = 'yamlGanttConfig'; // Consistent key

        let initialYamlPaneWidth = 25;
        const savedYamlPaneWidth = localStorage.getItem(LOCAL_STORAGE_KEY + '_yamlWidth');
        if(savedYamlPaneWidth) {
            let parsedWidth = parseFloat(savedYamlPaneWidth);
            initialYamlPaneWidth = Math.max(15, Math.min(parsedWidth, 85));
        }

        function applyInitialWidths() {
            yamlPane.style.width = `${initialYamlPaneWidth}%`;
            const resizerWidthPx = resizer.offsetWidth;
            const containerWidthPx = mainContainer.offsetWidth;
            if(containerWidthPx > 0) {
                const resizerWidthPercent = (resizerWidthPx / containerWidthPx) * 100;
                ganttPane.style.width = `${100 - initialYamlPaneWidth - resizerWidthPercent}%`;
            } else {
                ganttPane.style.width = `${100 - initialYamlPaneWidth - 1}%`;
            }
        }

        const defaultYaml = `
title: El Salvador Trip
viewMode: Day

tasks:
  - id: 'flightToSAL'
    name: 'Flight: SFO to SAL'
    start: '2025-07-26 2:20pm'
    end: '2025-07-26 8:50PM'
    custom_class: 'bar-flight'
  - id: 'hyattStay'
    name: 'City: Hyatt (3 nights)'
    start: '2025-07-26'
    end: '2025-07-28'
    dependencies: 'flightToSAL'
    custom_class: 'bar-hotel'
  - id: 'losChorros'
    name: 'Visit: Los Chorros'
    start: '2025-07-29 9am'
    end: '2025-07-29 5pm'
    dependencies: 'hyattStay'
    custom_class: 'bar-activity'
`;

        function parseDateToGanttFormat(dateString, taskName, fieldName) {
            if (!dateString) return null;
            if (typeof dayjs === 'undefined') { // Guard against dayjs not loading
                console.error("dayjs is not loaded. Cannot parse dates.");
                return dateString; // Return original, will likely fail in Frappe
            }

            const formats = [
                'YYYY-MM-DD h:mma', 'YYYY-MM-DD ha', 'YYYY-MM-DD H:mm', 'YYYY-MM-DD HH:mm',
                'YYYY-MM-DD hh:mma', 'YYYY-MM-DD hha', 'YYYY-MM-DD h:mm A', 'YYYY-MM-DD h A',
                'YYYY-MM-DD'
            ];
            let parsedDate = dayjs(dateString, formats, true); // true for strict format matching

            if (!parsedDate.isValid()) { // If strict matching fails, try flexible parsing
                parsedDate = dayjs(dateString);
            }

            if (parsedDate.isValid()) {
                return parsedDate.format('YYYY-MM-DD HH:mm:ss');
            } else {
                console.warn(`Could not parse ${fieldName} date "${dateString}" for task "${taskName || 'Unknown'}".`);
                return dateString; // Return original if all parsing attempts fail
            }
        }

        function renderGantt(yamlString) {
            // ... (renderGantt function as in your provided code, using the parseDateToGanttFormat above)
            errorDisplay.style.display = 'none';
            errorDisplay.textContent = '';
            let parsingErrors = [];

            try {
                const config = jsyaml.load(yamlString);
                if(!config || typeof config !== 'object') throw new Error("YAML content is empty or not an object.");
                const tasks = config.tasks || [];
                const viewMode = config.viewMode || 'Day';
                const chartTitle = config.title || 'Gantt Chart';

                const headerTitle = document.querySelector('header h1');
                if(headerTitle) headerTitle.textContent = chartTitle + " Live Preview";
                if(!Array.isArray(tasks)) throw new Error("'tasks' property must be an array.");

                const formattedTasks = tasks.map(task => {
                    if(!task.id || !task.name || !task.start || !task.end) {
                        parsingErrors.push(`Task "${task.name || task.id || 'Unknown'}" is missing required fields (id, name, start, end).`);
                        return null;
                    }

                    const startDateStr = parseDateToGanttFormat(task.start, task.name, 'start');
                    const endDateStr = parseDateToGanttFormat(task.end, task.name, 'end');

                    // Check validity again after our parsing attempt.
                    // Dayjs object might be valid but formatted string could be "Invalid Date" if original was truly bad.
                    // Or, if our parseDateToGanttFormat returned the original bad string.
                    if (!dayjs(startDateStr).isValid() || startDateStr === task.start && !dayjs(task.start).isValid() ) {
                        parsingErrors.push(`Invalid start date for task "${task.name}": "${task.start}"`);
                        return null;
                    }
                    if (!dayjs(endDateStr).isValid() || endDateStr === task.end && !dayjs(task.end).isValid() ) {
                        parsingErrors.push(`Invalid end date for task "${task.name}": "${task.end}"`);
                        return null;
                    }

                    return {
                        id: String(task.id), name: String(task.name),
                        start: startDateStr,
                        end: endDateStr,
                        dependencies: task.dependencies || '', custom_class: task.custom_class || ''
                    };
                }).filter(task => task !== null);

                if (parsingErrors.length > 0) {
                    errorDisplay.textContent = "Data Issues:\n" + parsingErrors.join("\n");
                    errorDisplay.style.display = 'block';
                }

                ganttChartTargetElement.innerHTML = '';
                if(formattedTasks.length === 0) { // This condition handles if ALL tasks were invalid or no tasks
                    gantt = null;
                    const noTaskMsg = document.createElement('p');
                    if (tasks.length > 0 && parsingErrors.length > 0) {
                        noTaskMsg.textContent = "No valid tasks to display due to errors. Check messages.";
                        noTaskMsg.style.color = "orange";
                    } else if (tasks.length > 0) {
                        noTaskMsg.textContent = "No valid tasks found after filtering.";
                        noTaskMsg.style.color = "orange";
                    }
                    else {
                        noTaskMsg.textContent = "No tasks defined in YAML.";
                        noTaskMsg.style.color = "#666";
                    }
                    noTaskMsg.style.textAlign = "center";
                    noTaskMsg.style.paddingTop = "20px";
                    ganttChartTargetElement.appendChild(noTaskMsg);
                    return;
                }

                gantt = new Gantt("#gantt-chart-target", formattedTasks, {
                    header_height: 50, column_width: 30, step: 24,
                    view_modes: ['Quarter Day', 'Half Day', 'Day', 'Week', 'Month'],
                    bar_height: 20, bar_corner_radius: 3, arrow_curve: 5, padding: 18,
                    view_mode: viewMode, date_format: 'YYYY-MM-DD HH:mm:ss',
                    language: 'en',
                    custom_popup_html: function(task) {
                        const startDate = task._start ? dayjs(task._start).format('MM/DD/YYYY h:mm A') : "Invalid";
                        const endDate = task._end ? dayjs(task._end).format('MM/DD/YYYY h:mm A') : "Invalid";
                        return `<div style="padding:10px; font-size:12px; color: #333;">
                                    <h5 style="margin:0 0 5px 0;">${task.name}</h5>
                                    <p style="margin:3px 0;">Start: ${startDate}</p>
                                    <p style="margin:3px 0;">End: ${endDate}</p>
                                </div>`;
                    }
                });
            } catch(e) {
                console.error("Error processing YAML or rendering Gantt:", e);
                errorDisplay.textContent = `Error: ${e.message}\n${e.stack ? e.stack.split('\n').slice(0, 3).join('\n') : ''}`;
                errorDisplay.style.display = 'block';
                ganttChartTargetElement.innerHTML = `<p style="color:red;text-align:center;padding-top:20px;">Failed to render chart.</p>`;
                gantt = null;
            }
        }

        require.config({paths: {'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'}});
        let workerProxy = URL.createObjectURL(new Blob([`
            self.MonacoEnvironment = {
                baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/'
            };
            importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js');
        `], {type: 'text/javascript'})); // Renamed 'proxy' to 'workerProxy' for clarity
        window.MonacoEnvironment = {getWorkerUrl: () => workerProxy}; // Use the renamed variable

        require(['vs/editor/editor.main'], function() {
            applyInitialWidths();
            const savedYaml = localStorage.getItem(LOCAL_STORAGE_KEY) || defaultYaml.trim();
            monacoEditor = monaco.editor.create(monacoEditorContainer, {
                value: savedYaml, language: 'yaml', theme: 'vs-dark',
                automaticLayout: true, minimap: {enabled: false}, wordWrap: 'on',
                scrollbar: {verticalScrollbarSize: 10, horizontalScrollbarSize: 10}
            });
            renderGantt(monacoEditor.getValue());
            monacoEditor.onDidChangeModelContent(() => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    const currentYaml = monacoEditor.getValue();
                    renderGantt(currentYaml);
                    try { localStorage.setItem(LOCAL_STORAGE_KEY, currentYaml); }
                    catch(e) {
                        console.warn("LocalStorage save error:", e);
                        errorDisplay.textContent = "Warning: Could not save to local storage.";
                        errorDisplay.style.color = "#ffcc00";
                        errorDisplay.style.display = 'block';
                        setTimeout(() => { errorDisplay.style.display = 'none'; }, 5000);
                    }
                }, 700);
            });

            saveToDiskButton.addEventListener('click', () => {
                if(!monacoEditor) return;
                const yamlContent = monacoEditor.getValue();
                const blob = new Blob([yamlContent], {type: 'text/yaml;charset=utf-8;'});
                const link = document.createElement("a");
                const objectURL = URL.createObjectURL(blob);
                link.setAttribute("href", objectURL);
                link.setAttribute("download", "gantt-config.yaml");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(objectURL);
            });

            loadFileInput.addEventListener('change', (event) => {
                if(!monacoEditor) return;
                const file = event.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        if(monacoEditor) monacoEditor.setValue(e.target.result);
                    };
                    reader.onerror = (err) => {
                        console.error("File reading error:", err);
                        errorDisplay.textContent = "Error reading file: " + (err.target.error.name || "Unknown error");
                        errorDisplay.style.display = 'block';
                    };
                    reader.readAsText(file);
                    event.target.value = null;
                }
            });

            document.addEventListener('keydown', function(event) {
                if(event.ctrlKey || event.metaKey) {
                    if(event.key === 's' || event.key === 'S') {
                        event.preventDefault();
                        saveToDiskButton.click();
                    } else if(event.key === 'o' || event.key === 'O') {
                        event.preventDefault();
                        loadFileInput.click();
                    }
                }
            });

            let isResizing = false;
            let initialMouseX;
            let initialYamlWidthPxAtDragStart;

            resizer.addEventListener('mousedown', function(e) {
                e.preventDefault(); isResizing = true; initialMouseX = e.clientX;
                initialYamlWidthPxAtDragStart = yamlPane.offsetWidth;
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
                document.body.style.userSelect = 'none'; document.body.style.pointerEvents = 'none';
            });
            function handleMouseMove(e) {
                if(!isResizing) return;
                const dx = e.clientX - initialMouseX;
                let newYamlWidthPx = initialYamlWidthPxAtDragStart + dx;
                const containerWidthPx = mainContainer.offsetWidth;
                const resizerWidthPx = resizer.offsetWidth;
                const minPaneWidthPx = containerWidthPx * 0.15;
                const maxPaneWidthPx = containerWidthPx * 0.85;
                newYamlWidthPx = Math.max(minPaneWidthPx, Math.min(newYamlWidthPx, maxPaneWidthPx - resizerWidthPx));
                const newYamlWidthPercent = (newYamlWidthPx / containerWidthPx) * 100;
                const newGanttWidthPercent = 100 - newYamlWidthPercent - (resizerWidthPx / containerWidthPx * 100);
                yamlPane.style.width = `${newYamlWidthPercent}%`;
                ganttPane.style.width = `${newGanttWidthPercent}%`;
                if(monacoEditor) { monacoEditor.layout(); }
            }
            function handleMouseUp() {
                if(!isResizing) return;
                isResizing = false;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
                document.body.style.userSelect = ''; document.body.style.pointerEvents = '';
                const currentYamlWidthPercent = (yamlPane.offsetWidth / mainContainer.offsetWidth) * 100;
                localStorage.setItem(LOCAL_STORAGE_KEY + '_yamlWidth', currentYamlWidthPercent.toFixed(2));
                if(monacoEditor) { monacoEditor.layout(); }
            }
        });
    </script>
</body>
</html>
