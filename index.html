<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAML Gantt Trip Planner</title>
    <style>@import url("https://cdn.jsdelivr.net/npm/frappe-gantt@1.0.3/dist/frappe-gantt.css") layer(frappe);</style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>YAML to Gantt Chart Live Preview</h1></header>
    <div class="container" id="main-container">
        <div class="yaml-pane" id="yaml-pane">
            <div class="yaml-pane-header-controls">
                <h3>YAML Configuration:</h3>
                <div class="file-controls">
                    <button id="save-to-disk-button">Save YAML</button>
                    <label for="load-file-input" id="load-from-disk-label">Load YAML</label>
                    <input type="file" id="load-file-input" accept=".yaml,.yml">
                    <button id="share-button">Share</button>
                </div>
            </div>
            <div id="error-display" class="error-message" style="display:none;"></div>
            <div id="monaco-editor-container"></div>
        </div>
        <div class="resizer" id="resizer"></div>
        <div class="gantt-pane" id="gantt-pane">
            <div class="gantt-chart-header"><h3>Gantt Chart Preview:</h3></div>
            <div id="gantt-chart-target-container">
                <div id="gantt-chart-target"></div>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/customParseFormat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/duration.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@1.0.3/dist/frappe-gantt.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

    <!-- Main Application Script -->
    <script src="script.js"></script>
</body>
</html>
